[tool]
id = "io.github.lightsongbook"
label = "Chords"
versionCode = 9
versionName = "0.4.1"
# INTERNET braucht nur der WLAN-Import (das iPad lädt Dateien direkt aufs Telefon), RECORD_AUDIO das Stimmgerät.
permissions = ["android.permission.INTERNET", "android.permission.RECORD_AUDIO"]
capabilities = []
# for the LightOS emulator, use the line below and build with -DlightSdk.allowAltServerPackage=true
# serverPackage = "com.thelightphone.sdk.emulator"
serverPackage = "com.lightos"
