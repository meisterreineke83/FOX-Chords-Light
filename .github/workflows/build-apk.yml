name: APK bauen

on:
  push:
    branches: [main]
    # Texte und Bilder brauchen keine neue APK
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version lesen
        id: v
        run: echo "version=$(grep '^versionName' tool/lighttool.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :tool:testDebugUnitTest -DlightSdk.toolOnly=true --stacktrace 2>&1 | tee build.log

      - name: APK bauen
        run: |
          set -o pipefail
          ./gradlew :tool:assembleDebug -DlightSdk.toolOnly=true --stacktrace 2>&1 | tee -a build.log
          cp tool/build/outputs/apk/debug/*.apk FOX-Chords-Light.apk

      # Kompilier- und Testfehler als Hinweise ausgeben (ohne Anmeldung über die API lesbar)
      - name: Fehler melden
        if: failure()
        run: |
          grep -E "^e: |FAILED|Exception|error:|Light SDK:|violation" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: FOX-Chords-Light-APK
          path: FOX-Chords-Light.apk

      - name: Release-Text zusammenstellen
        run: |
          cp docs/release-text.md release-body.md
          printf '\n---\nAutomatisch gebaut aus %s.\n' "${{ github.sha }}" >> release-body.md

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: FOX Chords Light ${{ steps.v.outputs.version }}
          prerelease: false
          make_latest: true
          files: FOX-Chords-Light.apk
          body_path: release-body.md
